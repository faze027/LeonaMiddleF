<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leona Is Everywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Silkscreen&display=swap">
<style>
:root {
  --paper: #3a252f;        /* plum from the background pattern */
  --grid: #1d1217;         /* its grid lines */
  --panel: #4b313c;        /* raised surfaces: buttons, chips, size picker */
  --ink: #f7e9ef;
  --muted: #c9abb8;
  --line: #6a4858;
  --accent: #f08cad;       /* rose: play, selected options, main action */
  --accent-hover: #f6a6c0;
  --on-accent: #2b1620;
  --error: #ff9d90;
  --stage: #000000;
  --r: #f2423a;
  --g: #1db36a;
  --b: #2e6bff;
  --focus: #ffd3e1;
  --ar: 1.72;
  --sans: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
body {
  margin: 0; background: transparent; color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 1320px; margin: 0 auto; padding: 22px clamp(14px, 3.2vw, 36px) 44px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { display: inline-flex; gap: 2px; }
.mark i { display: block; width: 5px; height: 20px; }
.mark i:nth-child(1), .px i:nth-child(1) { background: var(--r); }
.mark i:nth-child(2), .px i:nth-child(2) { background: var(--g); }
.mark i:nth-child(3), .px i:nth-child(3) { background: var(--b); }
h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: .01em; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; align-items: start; }

/* stage + timeline */
.deck { width: min(100%, calc(70vh * var(--ar))); min-width: min(100%, 520px); margin-inline: auto; }
.stage {
  position: relative; width: 100%; aspect-ratio: var(--ar);
  background: var(--stage); border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage.dragover { box-shadow: 0 0 0 2px var(--focus); }
.overlay {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 16px 16px;
  background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0)); color: #fff;
}
.overlay p { margin: 0 0 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; }
.bar span {
  display: block; height: 100%; width: 0;
  background: repeating-linear-gradient(90deg, var(--r) 0 2px, var(--g) 2px 4px, var(--b) 4px 6px);
  transition: width .15s linear;
}
.rec {
  position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 7px;
  padding: 5px 9px; border-radius: 4px; background: rgba(0,0,0,.62); color: #fff; font-size: 13px;
}
.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--r); }
.fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; margin: 0; color: #fff; text-align: center; }

.transport { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: center; margin-top: 20px; }
.play {
  width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.play svg { width: 18px; height: 18px; display: block; }
.strip {
  position: relative; height: 46px; border-radius: 3px; cursor: ew-resize;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; outline-offset: 5px;
}
.strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.playhead {
  position: absolute; top: -5px; bottom: -5px; left: 0; width: 2px; margin-left: -1px;
  background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; will-change: transform;
}
.px {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px; padding: 2px; background: #000; border-radius: 2px;
}
.px i { display: block; width: 3px; height: 9px; }
.marks { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); }
.marks button { border: 0; background: none; padding: 2px 0; font-size: 13px; color: var(--muted); }
.marks button:hover { color: var(--ink); }
.marks button:nth-child(1) { justify-self: start; }
.marks button:nth-child(2) { justify-self: center; }
.marks button:nth-child(3) { justify-self: end; }
.busy .strip { pointer-events: none; opacity: .5; }

/* side panel */
.panel { display: grid; gap: 22px; }
.wells { display: grid; gap: 20px; }
.well-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
h2 { margin: 0; font-size: 15px; font-weight: 650; }
.hint { color: var(--muted); font-size: 13px; }
.thumb {
  position: relative; display: block; width: 100%; aspect-ratio: var(--ar); padding: 0;
  border: 1px solid var(--line); border-radius: 4px; background: var(--stage); overflow: hidden;
}
.thumb canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
button.thumb:hover { border-color: var(--accent); }
.well.dragover .thumb { outline: 2px dashed var(--focus); outline-offset: 3px; }
.well-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.error { margin: 8px 0 0; font-size: 13px; color: var(--error); }

.btn {
  padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); font-size: 14px; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled), .play:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.chip {
  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); font-size: 13px;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.group { border-top: 1px solid var(--line); padding-top: 18px; }
.group h2 { margin-bottom: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button {
  flex: 1; min-width: 0; padding: 8px 0; border: 0; border-left: 1px solid var(--line);
  background: transparent; font-size: 14px; font-variant-numeric: tabular-nums;
}
.seg button:first-child { border-left: 0; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
.note { margin: 8px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note a { color: var(--accent); }

.slider { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; margin-top: 12px; font-size: 14px; }
.slider:first-of-type { margin-top: 0; }
.slider output { color: var(--muted); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.save-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 880px) {
  .work { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .wells { grid-template-columns: 1fr 1fr; gap: 14px; }
  .deck { min-width: 0; }
}
@media (max-width: 420px) {
  .well-head { flex-direction: column; gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bar span { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Wallahi, She Is Everywhere</h1>
    </div>
    <p class="lede">Pick any image From your laptop, OR phone. and turn it into the world's longest middle finger, leona flipping you off</p>
  </header>

  <main class="work">
    <section class="deck" id="deck" aria-label="Animation">
      <div class="stage" id="stage">
        <canvas id="gl" role="img" aria-label="The source image's pixels moving into the target image"></canvas>
        <div class="overlay" id="overlay" hidden>
          <p id="overlayText">Arranging pixels…</p>
          <div class="bar"><span id="bar"></span></div>
        </div>
        <div class="rec" id="rec" hidden>Recording</div>
        <p class="fatal" id="fatal" hidden></p>
      </div>

      <div class="transport">
        <button class="play" id="play" aria-label="Play" disabled>
          <svg id="iconPlay" viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" d="M4 2.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.3 0-1.7L5.6 1.3C4.9.9 4 1.4 4 2.2z"/></svg>
          <svg id="iconPause" viewBox="0 0 18 18" aria-hidden="true" hidden><rect fill="currentColor" x="3" y="2" width="4.2" height="14" rx="1.2"/><rect fill="currentColor" x="10.8" y="2" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <div class="strip" id="strip" role="slider" tabindex="0" aria-label="Animation position"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Before">
          <canvas id="stripCanvas"></canvas>
          <div class="playhead" id="playhead"><span class="px" aria-hidden="true"><i></i><i></i><i></i></span></div>
        </div>
        <div class="marks">
          <button type="button" data-jump="0">Before</button>
          <button type="button" data-jump="0.5">In between</button>
          <button type="button" data-jump="1">After</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="wells">
        <div class="well" id="sourceWell">
          <div class="well-head"><h2>Source</h2><span class="hint">its pixels get moved</span></div>
          <button class="thumb" id="sourceThumbBtn" type="button" aria-label="Choose source image"><canvas id="sourceThumb" width="1" height="1"></canvas></button>
          <div class="well-actions">
            <button class="btn" id="chooseSource" type="button">Choose image</button>
          </div>
          <div class="well-actions" role="group" aria-label="Sample source images">
            <button class="chip" type="button" data-sample="sunset" aria-pressed="false">Sunset</button>
            <button class="chip" type="button" data-sample="ocean" aria-pressed="false">Ocean</button>
            <button class="chip" type="button" data-sample="scrambled" aria-pressed="false">Scrambled</button>
          </div>
          <p class="error" id="sourceError" role="alert" hidden></p>
        </div>
        <div class="well" id="targetWell">
          <div class="well-head"><h2>Target</h2><span class="hint">what they form</span></div>
          <div class="thumb"><canvas id="targetThumb" width="1" height="1" role="img" aria-label="Target image"></canvas></div>
        </div>
      </div>

      <div class="group" role="group" aria-labelledby="sizeLabel">
        <h2 id="sizeLabel">Pixel size</h2>
        <div class="seg" id="sizes" role="radiogroup" aria-labelledby="sizeLabel"></div>
        <p class="note" id="count">&nbsp;</p>
      </div>

      <div class="group" role="group" aria-labelledby="motionLabel">
        <h2 id="motionLabel">Motion</h2>
        <label class="slider"><span>Duration</span><output id="durationOut">4.5 s</output>
          <input type="range" id="duration" min="1.5" max="12" step="0.5" value="4.5"></label>
        <label class="slider"><span>Swirl</span><output id="swirlOut">30%</output>
          <input type="range" id="swirl" min="0" max="100" step="1" value="30"></label>
        <label class="slider"><span>Scatter</span><output id="scatterOut">45%</output>
          <input type="range" id="scatter" min="0" max="100" step="1" value="45"></label>
        <label class="toggle"><input type="checkbox" id="loop"><span>Loop back and forth</span></label>
      </div>

      <div class="group" id="saveGroup" role="group" aria-labelledby="saveLabel">
        <h2 id="saveLabel">Save</h2>
        <div class="save-actions">
          <button class="btn primary" id="saveVideo" type="button" disabled>Save video</button>
          <button class="btn" id="saveImage" type="button" disabled>Save image</button>
        </div>
        <p class="note" id="saveStatus" aria-live="polite"></p>
      </div>
    </aside>
  </main>
  <input type="file" id="file" accept="image/*" hidden>
</div>

  // ------------------------------------------------------------------ images
  function rasterize(img, cols, rows) {

    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;

  function scramble(px, n) {

    for (let i = 0; i < n; i++) order[i] = i;

    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }

    const w = 1200, h = 800, c = canvasOf(w, h), g = c.getContext("2d", { willReadFrequently: true });
    const lin = (y0, y1, stops) => { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; };

  // ------------------------------------------------------------------ matching
  const LIN = new Float32Array(256);

  // perm[cell] = index of the source pixel that ends up on target cell `cell`
  async function matchPixels(S, T, n, job, onProgress) {
    const it = byLightness(T, n), is = byLightness(S, n);
    const perm = new Int32Array(n);
    for (let i = 0; i < n; i++) perm[it[i]] = is[i];      // darkest -> darkest, brightest -> brightest
    const cur = new Float32Array(n);
    for (let p = 0; p < n; p++) {

      const d0 = S[a] - T[b], d1 = S[a + 1] - T[b + 1], d2 = S[a + 2] - T[b + 2];

          d0 = S[pa3] - T[b3]; d1 = S[pa3 + 1] - T[b3 + 1]; d2 = S[pa3 + 2] - T[b3 + 2];
          const cba = d0 * d0 + d1 * d1 + d2 * d2;
          if (cab + cba < cur[a] + cur[b]) { perm[a] = pb; perm[b] = pa; cur[a] = cab; cur[b] = cba; }
        }

      onProgress(Math.max(round / MAX_ROUNDS, (performance.now() - t0) / BUDGET_MS));

  // when each pixel leaves (smooth noise over the source, so it breaks apart in patches) + swirl strength
  function makeRandoms(cols, rows, n) {
    const rnd = mulberry32(0x5eed ^ (cols * 7919 + rows));
    const gx = 6, gy = Math.max(2, Math.round(6 * rows / cols));
    const grid = new Float32Array((gx + 1) * (gy + 1));
    for (let i = 0; i < grid.length; i++) grid[i] = rnd();
    const key = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const x = ((k % cols) + 0.5) / cols * gx, y = (Math.floor(k / cols) + 0.5) / rows * gy;
      const x0 = Math.min(gx - 1, Math.floor(x)), y0 = Math.min(gy - 1, Math.floor(y));
      let fx = x - x0, fy = y - y0;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const i0 = y0 * (gx + 1) + x0, i1 = i0 + gx + 1;
      const top = grid[i0] + (grid[i0 + 1] - grid[i0]) * fx;
      const bot = grid[i1] + (grid[i1 + 1] - grid[i1]) * fx;
      key[k] = 0.6 * (top + (bot - top) * fy) + 0.4 * rnd();
    }
    const order = new Uint32Array(n);
    for (let i = 0; i < n; i++) order[i] = i;
    order.sort((a, b) => key[a] - key[b]);
    const out = new Float32Array(n * 2);
    for (let r = 0; r < n; r++) { const k = order[r]; out[2 * k] = r / n; out[2 * k + 1] = 0.55 + 0.9 * rnd(); }
    return out;
  }

  // ------------------------------------------------------------------ build pipeline
  async function rebuild() {
    if (!gl || !state.targetImg || !state.source) return;
    const job = ++state.job;
    pause();
    const iw = state.targetImg.naturalWidth || state.targetImg.width;
    const ih = state.targetImg.naturalHeight || state.targetImg.height;
    const ar = iw / ih;
    const cols = Math.max(8, Math.round((ar >= 1 ? ART_MAX : ART_MAX * ar) / state.size));
    const rows = Math.max(8, Math.round((ar >= 1 ? ART_MAX / ar : ART_MAX) / state.size));
    const n = cols * rows;
    document.documentElement.style.setProperty("--ar", (cols / rows).toFixed(5));

    const tc = state.tgtCache;
    const tgtPx = tc && tc.img === state.targetImg && tc.cols === cols && tc.rows === rows
      ? tc.px : rasterize(state.targetImg, cols, rows);
    state.tgtCache = { img: state.targetImg, cols, rows, px: tgtPx };
    const srcPx = state.source.kind === "scramble" ? scramble(tgtPx, n) : rasterize(state.source.img, cols, rows);
    putThumb(ui.targetThumb, tgtPx, cols, rows);
    putThumb(ui.sourceThumb, srcPx, cols, rows);
    ui.count.textContent = `${n.toLocaleString()} pixels`;

    const startArr = new Float32Array(n * 2);
    for (let k = 0; k < n; k++) { startArr[2 * k] = k % cols; startArr[2 * k + 1] = Math.floor(k / cols); }
    Object.assign(state, { cols, rows, n, srcPx, tgtPx, perm: null, startArr, endArr: startArr,
                           randArr: makeRandoms(cols, rows, n), t: 0, dir: 1, ready: true });
    uploadAll();
    setBusy(true);
    showProgress(0, n);
    resizeGL(); layoutStrip(); dirty = true;
    await yieldToUI();
    if (job !== state.job) return;

    const perm = await matchPixels(toLab(srcPx, n), toLab(tgtPx, n), n, job, (p) => showProgress(p, n));
    if (!perm || job !== state.job) return;
    const endArr = new Float32Array(n * 2);
    for (let p = 0; p < n; p++) { const k = perm[p]; endArr[2 * k] = p % cols; endArr[2 * k + 1] = Math.floor(p / cols); }
    Object.assign(state, { perm, endArr });
    upload(B.end, endArr);
    setBusy(false);
    drawStrip();
    dirty = true;
    if (!reduceMotion) { state.t = 0; state.dir = 1; state.hold = START_HOLD; play(); }
  }

  function setBusy(on) {
    state.busy = on;
    ui.overlay.hidden = !on;
    ui.deck.classList.toggle("busy", on);
    const off = on || !!state.recording;
    ui.play.disabled = off;
    ui.saveVideo.disabled = off;
    ui.saveImage.disabled = off;
  }
  function showProgress(p, n) {
    const pct = Math.round(clamp(p, 0, 1) * 100);
    ui.overlayText.textContent = `Arranging ${n.toLocaleString()} pixels… ${pct}%`;
    ui.bar.style.width = `${pct}%`;
  }

  // ------------------------------------------------------------------ playback
  function play() {
    if (!state.perm || state.recording) return;
    if (state.t >= 1 && !state.loop) { state.t = 0; state.dir = 1; state.hold = 0.25; }
    else if (state.t >= 1) state.dir = -1;
    else if (state.t <= 0) state.dir = 1;
    state.playing = true;
    setPlayIcon(true);
  }
  function pause() { state.playing = false; state.hold = 0; setPlayIcon(false); }
  function togglePlay() { if (state.playing) pause(); else play(); }
  function setPlayIcon(on) {
    ui.iconPlay.hidden = on; ui.iconPause.hidden = !on;
    ui.play.setAttribute("aria-label", on ? "Pause" : "Play");
  }
  function advance(dt) {
    if (state.hold > 0) { state.hold -= dt; return; }
    state.t += state.dir * dt / state.duration;
    if (state.t >= 1) {
      state.t = 1;
      if (state.loop) { state.dir = -1; state.hold = HOLD; } else pause();
    } else if (state.t <= 0) {
      state.t = 0;
      if (state.loop) { state.dir = 1; state.hold = HOLD; } else pause();
    }
  }
  function seek(t) { pause(); state.t = clamp(t, 0, 1); state.dir = 1; dirty = true; }

  let last = 0, ariaAt = 0;
  function tick(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;   // a dropped frame slows time instead of jumping
    last = now;
    if (state.recording) recordStep(now);
    else if (state.playing) { advance(dt); dirty = true; }
    if (dirty) {
      dirty = false;
      render(state.t);
      placePlayhead();
      if (!state.playing || now - ariaAt > 400) { ariaAt = now; updateAria(); }
    }
    requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------------ filmstrip timeline
  const strip = { F: 9, fw: 1, w: 1, h: 46, gap: 3 };
  function layoutStrip() {
    const w = ui.strip.clientWidth;
    if (!w) return;
    let F = clamp(Math.round(w / 92), 5, 11);
    if (F % 2 === 0) F -= 1;
    const fw = w / F;
    const ar = state.cols ? state.cols / state.rows : 1.72;
    const h = Math.max(20, Math.round((fw - strip.gap) / ar));
    Object.assign(strip, { F, fw, w, h });
    ui.strip.style.height = `${h}px`;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ui.stripCanvas.width = Math.round(w * dpr);
    ui.stripCanvas.height = Math.round(h * dpr);
    drawStrip();
    placePlayhead();
  }
  function drawStrip() {
    if (state.recording) { drawStripSoon(); return; }   // never paint thumbnails into a recording
    const c = ui.stripCanvas, ctx = c.getContext("2d"), F = strip.F;
    ctx.clearRect(0, 0, c.width, c.height);
    const fw = c.width / F, gap = strip.gap * (c.width / strip.w);
    const ready = !!state.perm && !!gl;
    if (!ready) ctx.fillStyle = cssVar("--line");
    for (let k = 0; k < F; k++) {
      const x = Math.round(k * fw + gap / 2), w = Math.round(fw - gap);
      if (ready) { render(k / (F - 1)); ctx.drawImage(ui.gl, x, 0, w, c.height); }
      else ctx.fillRect(x, 0, w, c.height);
    }
    if (ready) render(state.t);
  }
  let stripTimer = 0;
  const drawStripSoon = () => { clearTimeout(stripTimer); stripTimer = setTimeout(drawStrip, 120); };

  function placePlayhead() {
    const x = strip.fw / 2 + state.t * (strip.w - strip.fw);
    ui.playhead.style.transform = `translateX(${x.toFixed(2)}px)`;
  }
  function updateAria() {
    const pct = Math.round(state.t * 100);
    ui.strip.setAttribute("aria-valuenow", String(pct));
    ui.strip.setAttribute("aria-valuetext", pct <= 0 ? "Before" : pct >= 100 ? "After" : `${pct}% of the way`);
  }

  let scrubbing = false;
  const tFromX = (clientX) => {
    const r = ui.strip.getBoundingClientRect();
    return (clientX - r.left - strip.fw / 2) / Math.max(1, r.width - strip.fw);
  };
  ui.strip.addEventListener("pointerdown", (e) => {
    if (!state.perm || state.recording || state.busy) return;
    scrubbing = true;
    ui.strip.setPointerCapture(e.pointerId);
    seek(tFromX(e.clientX));
  });
  ui.strip.addEventListener("pointermove", (e) => { if (scrubbing) seek(tFromX(e.clientX)); });
  const endScrub = () => { scrubbing = false; };
  ui.strip.addEventListener("pointerup", endScrub);
  ui.strip.addEventListener("pointercancel", endScrub);
  ui.strip.addEventListener("keydown", (e) => {
    if (!state.perm || state.recording) return;
    const steps = { ArrowRight: 0.02, ArrowUp: 0.02, ArrowLeft: -0.02, ArrowDown: -0.02, PageUp: 0.1, PageDown: -0.1 };
    if (e.key in steps) seek(state.t + steps[e.key]);
    else if (e.key === "Home") seek(0);
    else if (e.key === "End") seek(1);
    else if (e.key === " " || e.key === "Enter") togglePlay();
    else return;
    e.preventDefault();
  });
  document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
    if (state.perm && !state.recording) seek(+b.dataset.jump);
  }));
  ui.play.addEventListener("click", togglePlay);
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.target.closest("input, textarea, select, button, [role=slider]")) return;
    e.preventDefault();
    togglePlay();
  });

  // ------------------------------------------------------------------ inputs
  // the target is fixed: only the source image can be changed
  ui.chooseSource.addEventListener("click", pickFile);
  ui.sourceThumbBtn.addEventListener("click", pickFile);
  function pickFile() { if (state.recording) return; ui.file.value = ""; ui.file.click(); }
  ui.file.addEventListener("change", () => { const f = ui.file.files && ui.file.files[0]; if (f) useFile(f); });

  function setError(msg) { ui.sourceError.textContent = msg; ui.sourceError.hidden = !msg; }
  async function useFile(file) {
    if (state.recording) return;
    try {
      const img = await fileToImage(file);
      if (!(img.naturalWidth && img.naturalHeight)) throw new Error("empty");
      setError("");
      state.source = { kind: "image", img };
      markSample(null);
      rebuild();
    } catch (err) {
      setError("That file couldn't be opened as an image. Try a JPG, PNG or WebP.");
    }
  }

  const firstImage = (dt) => {
    if (!dt || !dt.files) return null;
    for (const f of dt.files) if (!f.type || f.type.startsWith("image/")) return f;
    return null;
  };
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  function wireDrop(el) {
    el.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); el.classList.add("dragover"); } });
    el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove("dragover"); });
    el.addEventListener("drop", (e) => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove("dragover");
      const f = firstImage(e.dataTransfer);
      if (f) useFile(f);
    });
  }
  wireDrop(ui.sourceWell);
  wireDrop(ui.stage);
  document.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    const f = firstImage(e.dataTransfer);
    if (f) useFile(f);
  });
  document.addEventListener("paste", (e) => {
    const items = e.clipboardData ? Array.from(e.clipboardData.items) : [];
    const item = items.find((it) => it.kind === "file" && it.type.startsWith("image/"));
    const f = item && item.getAsFile();
    if (f) { e.preventDefault(); useFile(f); }
  });

  const chips = Array.from(document.querySelectorAll("[data-sample]"));
  function markSample(name) { chips.forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.sample === name))); }
  chips.forEach((c) => c.addEventListener("click", () => {
    if (state.recording) return;
    const name = c.dataset.sample;
    state.source = name === "scrambled" ? { kind: "scramble" } : { kind: "image", img: sample(name) };
    markSample(name);
    setError("");
    rebuild();
  }));

  SIZES.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(s);
    b.setAttribute("role", "radio");
    b.setAttribute("aria-label", `${s} pixel size`);
    b.addEventListener("click", () => setSize(s));
    ui.sizes.appendChild(b);
  });
  function markSize() {
    Array.from(ui.sizes.children).forEach((b, i) => {
      const on = SIZES[i] === state.size;
      b.setAttribute("aria-checked", String(on));
      b.tabIndex = on ? 0 : -1;
    });
  }
  function setSize(s) {
    if (state.recording || s === state.size) return;
    state.size = s; markSize(); rebuild();
  }
  ui.sizes.addEventListener("keydown", (e) => {
    const i = SIZES.indexOf(state.size);
    const d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    const j = clamp(i + d, 0, SIZES.length - 1);
    setSize(SIZES[j]);
    ui.sizes.children[j].focus();
  });
  markSize();

  ui.duration.addEventListener("input", () => {
    state.duration = +ui.duration.value;
    ui.durationOut.textContent = `${state.duration.toFixed(1)} s`;
  });
  ui.swirl.addEventListener("input", () => {
    state.swirl = ui.swirl.value / 100;
    ui.swirlOut.textContent = `${ui.swirl.value}%`;
    dirty = true; drawStripSoon();
  });
  ui.scatter.addEventListener("input", () => {
    state.scatter = (ui.scatter.value / 100) * 0.85;
    ui.scatterOut.textContent = `${ui.scatter.value}%`;
    dirty = true; drawStripSoon();
  });
  ui.loop.addEventListener("change", () => { state.loop = ui.loop.checked; });

  // ------------------------------------------------------------------ saving
  let lastUrl = null;
  function offer(filename, blob) {
    if (!blob) return;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = lastUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // if the browser blocked the automatic download, this link still works
    const again = document.createElement("a");
    again.href = lastUrl;
    again.download = filename;
    again.textContent = "Download again";
    ui.saveStatus.replaceChildren(`${filename} is downloading. `, again);
  }

  ui.saveImage.addEventListener("click", async () => {
    if (!state.perm || state.recording) return;
    const { cols, rows, n, perm, srcPx } = state;
    const small = canvasOf(cols, rows), sctx = small.getContext("2d");
    const img = sctx.createImageData(cols, rows);
    for (let p = 0; p < n; p++) {
      const k = perm[p] * 4, q = p * 4;
      img.data[q] = srcPx[k]; img.data[q + 1] = srcPx[k + 1]; img.data[q + 2] = srcPx[k + 2]; img.data[q + 3] = 255;
    }
    sctx.putImageData(img, 0, 0);
    const f = Math.max(1, Math.floor(1600 / Math.max(cols, rows)));
    const big = canvasOf(cols * f, rows * f), bctx = big.getContext("2d");
    bctx.imageSmoothingEnabled = false;
    bctx.drawImage(small, 0, 0, big.width, big.height);
    const blob = await new Promise((r) => big.toBlob(r, "image/png"));
    offer("pixel-reorder.png", blob);
  });

  ui.saveVideo.addEventListener("click", async () => {
    if (!state.perm || state.recording || state.busy) return;
    const types = ["video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1", "video/mp4",
                   "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    const mime = typeof MediaRecorder !== "undefined" && ui.gl.captureStream
      ? types.find((m) => MediaRecorder.isTypeSupported(m)) : null;
    if (!mime) { ui.saveStatus.textContent = "This browser can't record video from the page. Chrome, Edge, Firefox and Safari can."; return; }
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";

    // record at a fixed size so the video doesn't depend on the window size
    const ar = state.cols / state.rows;
    let w = ar >= 1 ? 1280 : Math.round(1280 * ar), h = ar >= 1 ? Math.round(1280 / ar) : 1280;
    w -= w % 2; h -= h % 2;
    pause();
    const plan = { h0: 0.7, d: state.duration, h1: 1.5, loop: state.loop };
    plan.total = plan.loop ? 2 * plan.h0 + 2 * plan.d + plan.h1 : plan.h0 + plan.d + plan.h1;
    let finish;
    const finished = new Promise((r) => { finish = r; });
    state.recording = { start: 0, plan, finish, done: false };
    ui.gl.width = w; ui.gl.height = h;
    state.t = 0; render(0);
    setBusy(false);
    ui.rec.hidden = false;
    ui.saveStatus.textContent = "";

    const stream = ui.gl.captureStream(60);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { rec.onstop = r; });
    rec.start(1000);
    state.recording.start = performance.now();
    await finished;
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    rec.stop();
    await stopped;
    stream.getTracks().forEach((tr) => tr.stop());
    state.recording = null;
    ui.rec.hidden = true;
    ui.saveVideo.textContent = "Save video";
    setBusy(false);
    resizeGL();
    dirty = true;
    offer(`pixel-reorder.${ext}`, new Blob(chunks, { type: mime.split(";")[0] }));
  });

  function recordStep(now) {
    const rec = state.recording;
    if (!rec.start) { dirty = true; return; }
    const p = rec.plan, el = (now - rec.start) / 1000;
    let t;
    if (el < p.h0) t = 0;
    else if (el < p.h0 + p.d) t = (el - p.h0) / p.d;
    else if (el < p.h0 + p.d + p.h1) t = 1;
    else if (p.loop && el < p.h0 + 2 * p.d + p.h1) t = 1 - (el - p.h0 - p.d - p.h1) / p.d;
    else if (p.loop && el < p.total) t = 0;
    else { t = p.loop ? 0 : 1; if (!rec.done) { rec.done = true; rec.finish(); } }
    state.t = t;
    dirty = true;
    ui.saveVideo.textContent = `Recording ${Math.min(100, Math.round((el / p.total) * 100))}%`;
  }

  // ------------------------------------------------------------------ start
  function fatal(msg) {
    ui.fatal.textContent = msg; ui.fatal.hidden = false;
    ui.overlay.hidden = true;
  }

  try {
    if (!setupGL()) { fatal("This browser has WebGL turned off, and the animation needs it. Try Chrome, Edge, Firefox or Safari with hardware acceleration on."); return; }
  } catch (err) {
    fatal("The graphics card refused to set up the animation. Reloading the page usually fixes this.");
    return;
  }
  ui.gl.addEventListener("webglcontextlost", (e) => { e.preventDefault(); pause(); });
  ui.gl.addEventListener("webglcontextrestored", () => { if (setupGL()) { uploadAll(); dirty = true; } });

  new ResizeObserver(() => { resizeGL(); }).observe(ui.stage);
  new ResizeObserver(() => { if (ui.strip.clientWidth !== strip.w) layoutStrip(); }).observe(ui.strip);
  requestAnimationFrame(tick);

  state.source = { kind: "image", img: sample("sunset") };
  markSample("sunset");
  loadURL(TARGET_SRC).then((img) => { state.targetImg = img; rebuild(); })
    .catch(() => fatal("The target image didn't load. Reload the page to try again."));
})();
</script>
</body>
</html>
